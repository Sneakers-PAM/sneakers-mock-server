query SharingFolderRuleset($folderId: String!) {
  folderRuleset(folderId: $folderId) {
    folderId owners rules { id order subjectKind subjectName subjectId grants { action value } } inherited { fromFolderId fromFolderName rule { id order subjectKind subjectName subjectId grants { action value } } }
  }
}
