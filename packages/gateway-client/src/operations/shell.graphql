query ShellCounts($userId: String!) {
  activeLeasesForUser(userId: $userId) {
    id
    secretId
    expiresAt
  }
  approvalRequests {
    id
    status
    requestedByUserId
  }
  pendingSecretUses {
    id
  }
}

query MyNotifications($limit: Int) {
  myNotifications(limit: $limit) {
    id
    action
    resourceKind
    resourceId
    resourceLabel
    actorLabel
    occurredAt
    read
  }
  myUnreadNotificationCount
}

query UnreadCount {
  myUnreadNotificationCount
}

mutation MarkNotificationRead($id: ID!) {
  markNotificationRead(id: $id)
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead
}

query ApplianceStatus {
  appliance {
    maintenance
    maintenanceReason
    mcp
  }
}

# The box's host name, for the admin console's link to the box's own :8443 pages.
query ApplianceAdminHost {
  diagnostics {
    box {
      fqdn
    }
  }
}

query Diagnostics {
  diagnostics {
    generatedAt
    traceId
    publicUrl
    productVersion
    appliance
    box {
      baseOS
      baseWeb
      fqdn
    }
    actor {
      id
      username
      roles
    }
    gateway {
      ...ComponentVersionFields
    }
    services {
      ...ComponentVersionFields
    }
    thirdParty {
      ...ComponentVersionFields
    }
  }
}

fragment ComponentVersionFields on ComponentVersion {
  name
  version
  commit
  status
  dependencies {
    name
    state
    required
    error
    version
  }
}

# Break-glass mode, for the banner on every page: the caller's open session, or null.
query BreakGlassCurrent {
  breakGlassSession {
    id
    reason
    openedAt
    expiresAt
  }
}

mutation BreakGlassExit($id: ID!) {
  closeBreakGlassSession(id: $id) {
    id
    endedAt
    endReason
  }
}
