# Staff targets (U-10, U-11) and the SSH terminal (U-12). Staff pick a connection; only admins
# change connections. The terminal asks for non-sensitive fields only (the username); the key
# stays in the vault and the broker reveals it itself when the browser redeems the ticket.

fragment TargetsTargetFields on Target {
  id
  name
  hostname
  kind
  domain
  realm
  connectionId
  connections {
    connectionId
    isDefault
  }
  description
  secretCount
  ownerUserId
  sshHostKeys
}

fragment TargetsConnectionFields on Connection {
  id
  name
  protocol
  port
  description
}

query TargetsList {
  targets {
    ...TargetsTargetFields
  }
  connections {
    ...TargetsConnectionFields
  }
}

mutation TargetsSave($input: TargetInput!) {
  saveTarget(input: $input) {
    ...TargetsTargetFields
  }
}

mutation TargetsDelete($id: ID!) {
  deleteTarget(id: $id)
}

# #168: the target's own page, "every secret attached to this target".
query TargetsAttachedSecrets($targetId: ID!) {
  secretsByTarget(targetId: $targetId) {
    id
    name
    canRead
  }
}

query TargetsTerminal($id: ID!) {
  secret(id: $id) {
    id
    name
    typeId
    targetId
    targetIds
    retired
    canRead
  }
  targets {
    id
    name
    hostname
    connectionId
    sshHostKeys
  }
  connections {
    id
    protocol
    port
  }
}

query TargetsTerminalFields($id: ID!) {
  secretFields(id: $id) {
    key
    value
  }
}

mutation TargetsOpenSshSession($secretId: ID!, $targetId: ID) {
  openSshSession(secretId: $secretId, targetId: $targetId) {
    wsUrl
    ticket
    sessionId
    expiresInSeconds
  }
}

# Trust-on-first-use host-key pinning (U-12's "not pinned" card). A scan never pins; only a
# confirmed pinTargetHostKey call does.
query TargetsScanHostKey($targetId: ID!) {
  scanTargetHostKey(targetId: $targetId) {
    targetId
    keyType
    publicKey
    fingerprint
    pinned
  }
}

mutation TargetsPinHostKey($targetId: ID!, $fingerprint: String!) {
  pinTargetHostKey(targetId: $targetId, fingerprint: $fingerprint) {
    id
    sshHostKeys
  }
}
