fragment AgentsTokenFields on UserToken {
  id
  label
  clientName
  createdAtUnix
  lastUsedAtUnix
  expiresAtUnix
  revokedAtUnix
}

fragment AgentsUseFields on SecretUse {
  id
  secretName
  fieldKey
  argv
  clientLabel
  state
  expiresAtUnix
  reveal
  runId
  confirm
  requestedBy
}

fragment AgentsGrantFields on UseGrant {
  id
  tokenId
  secretIds
  folderId
  fieldKeys
  programs {
    program
    argPattern
  }
  expiresAtUnix
  maxUses
  uses
  revokedAtUnix
  allowReveal
}

query AgentsTokens {
  myTokens {
    ...AgentsTokenFields
  }
}

mutation AgentsRevokeToken($id: ID!) {
  revokeMyToken(id: $id) {
    ...AgentsTokenFields
  }
}

mutation AgentsDeleteToken($id: ID!) {
  deleteMyToken(id: $id)
}

# The approvals page: other people's uses you may decide, and your own still waiting.
query AgentsPendingUses {
  secretUsesToDecide {
    ...AgentsUseFields
  }
  pendingSecretUses {
    ...AgentsUseFields
  }
}

# Approving someone else's use needs the factor (or the session's step-up window); denying
# doesn't. Denying your own use withdraws it.
mutation AgentsDecideUse($id: ID!, $approve: Boolean!, $factor: FactorInput) {
  decideSecretUse(id: $id, approve: $approve, factor: $factor) {
    ...AgentsUseFields
  }
}

# The grants page: the grants, the tokens they can name, and what the form can pick from.
query AgentsGrants {
  useGrants {
    ...AgentsGrantFields
  }
  myTokens {
    ...AgentsTokenFields
  }
  folders {
    id
    name
    parentId
  }
  secretsByStatus(status: "all") {
    id
    name
    folderId
    typeId
  }
  secretTypes {
    id
    fields {
      key
      label
      sensitive
    }
  }
}

mutation AgentsCreateGrant($input: UseGrantInput!, $factor: FactorInput!) {
  createUseGrant(input: $input, factor: $factor) {
    ...AgentsGrantFields
  }
}

mutation AgentsRevokeGrant($id: ID!) {
  revokeUseGrant(id: $id) {
    ...AgentsGrantFields
  }
}

# Email a code for the factor an approval or a new grant carries.
mutation AgentsSendFactorEmail {
  sendMfaEmailCode
}

mutation AgentsBeginFactorPasskey {
  beginMfaPasskey {
    options
    webauthnSessionId
  }
}

fragment AgentsRunUseFields on SecretUse {
  ...AgentsUseFields
  purpose
  requester
}

# The run page: every pending use one agent run raised, and how long the session's factor covers an approval.
query AgentsUseRun($runId: ID!) {
  secretUseRun(runId: $runId) {
    runId
    mfaFreshUntilUnix
    uses {
      ...AgentsRunUseFields
    }
  }
}

# Decide the ticked uses of a run together. The page proves the factor through the session step-up first.
mutation AgentsDecideUses($ids: [ID!]!, $decision: SecretUseDecision!, $factor: FactorInput) {
  decideSecretUses(ids: $ids, decision: $decision, factor: $factor) {
    outcomes {
      id
      decided
      reason
      use {
        ...AgentsRunUseFields
      }
    }
  }
}

# Confirm your own uses that nobody else can decide, once for the task. The page proves the
# factor through the session step-up first.
mutation AgentsConfirmUses($ids: [ID!]!, $factor: FactorInput) {
  confirmSecretUses(ids: $ids, factor: $factor) {
    outcomes {
      id
      decided
      reason
      use {
        ...AgentsRunUseFields
      }
    }
  }
}
