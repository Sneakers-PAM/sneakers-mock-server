# The secret detail page (U-04). Field values come only from secretFields (non-sensitive) and
# the reveal mutations; nothing here asks for a sensitive value.

fragment SecretDetailFields on Secret {
  id
  name
  canRead
  folderId
  typeId
  targetId
  targetIds
  creatorPrincipalId
  expiresAt
  lastHeartbeatResult
  verifiedAt
  viewCount
  lastAccessedAt
  retired
  retiredAt
  lastRotationResult
  rotatedAt
  rotationIntervalDays
  nextRotationAt
  rotationOptOut
  heartbeatOptOut
  heartbeatBlockedReason
  requireTokenApproval
  alwaysRequireApproval
}

fragment SecretCertMetaFields on CertMeta {
  subject
  issuer
  sans
  notBefore
  notAfter
  serialNumber
  fingerprintSha256
  keyAlgorithm
  keyBits
  isCA
  hasPrivateKey
}

query SecretDetail($id: ID!) {
  secret(id: $id) {
    ...SecretDetailFields
  }
  secretTypes {
    id
    name
    origin
    vendor
    checkout
    heartbeat
    rotation
    fields {
      key
      label
      kind
      options
      required
      sensitive
      superSensitive
      rotates
    }
  }
  folders {
    id
    name
    parentId
    scope
  }
  targets {
    id
    name
    hostname
  }
}

query SecretAccess($secretId: String!) {
  mySecretAccess(secretId: $secretId) {
    read
    reveal
    manage
    approve
    informed
  }
}

query SecretFields($id: ID!) {
  secretFields(id: $id) {
    key
    value
  }
}

query SecretVersions($secretId: ID!) {
  secretVersions(secretId: $secretId) {
    versionNo
    createdBy
    createdByName
    createdAt
    active
    fieldKeys
    changedFieldKeys
    changeLabel
  }
}

mutation SecretReveal($id: ID!, $fieldKey: String!) {
  revealSecretField(id: $id, fieldKey: $fieldKey)
}

# A reveal the secret's approval level holds for a decision (revealSecretField answered
# APPROVAL_REQUIRED): one task's reveals share runId, so they're decided on one page.
mutation SecretPrepareReveal($secretId: ID!, $fieldKey: String!, $runId: ID) {
  prepareSecretReveal(secretId: $secretId, fieldKey: $fieldKey, runId: $runId) {
    id
    state
    confirm
    runId
    expiresAtUnix
  }
}

# The value of an approved reveal, once.
mutation SecretRedeemReveal($id: ID!) {
  redeemSecretReveal(id: $id)
}

mutation SecretRevealVersion($secretId: ID!, $versionNo: Int!, $fieldKey: String!) {
  revealSecretVersionField(secretId: $secretId, versionNo: $versionNo, fieldKey: $fieldKey)
}

# The recovery role and a fresh MFA; refused while the secret is checked out or rotating.
mutation SecretRestoreVersion($secretId: ID!, $versionNo: Int!) {
  restoreSecretVersion(secretId: $secretId, versionNo: $versionNo) {
    ...SecretDetailFields
  }
}

# With a sessionId it's a reveal in break-glass mode, recorded under that session.
mutation SecretBreakGlass($secretId: String!, $reason: String!, $code: String!, $sessionId: ID) {
  breakGlassSecret(secretId: $secretId, reason: $reason, code: $code, sessionId: $sessionId) {
    key
    value
  }
}

mutation SecretRotate($secretId: String!) {
  rotateSecret(secretId: $secretId)
}

mutation SecretSetAutomation(
  $secretId: String!
  $disableRotation: Boolean!
  $disableHeartbeat: Boolean!
) {
  setSecretAutomation(
    secretId: $secretId
    disableRotation: $disableRotation
    disableHeartbeat: $disableHeartbeat
  ) {
    ...SecretDetailFields
  }
}

mutation SecretSetTokenApproval($secretId: String!, $required: Boolean!, $always: Boolean) {
  setSecretTokenApproval(secretId: $secretId, required: $required, always: $always) {
    ...SecretDetailFields
  }
}

mutation SecretRetire($id: String!) {
  retireSecret(id: $id) {
    ...SecretDetailFields
  }
}

mutation SecretRestore($id: String!) {
  restoreSecret(id: $id) {
    ...SecretDetailFields
  }
}

mutation SecretDelete($id: String!) {
  deleteSecret(id: $id)
}

# #168: attach/detach one target on the secret's list without touching the others.
mutation SecretAttachTarget($secretId: ID!, $targetId: ID!) {
  attachSecretTarget(secretId: $secretId, targetId: $targetId) {
    ...SecretDetailFields
  }
}

mutation SecretDetachTarget($secretId: ID!, $targetId: ID!) {
  detachSecretTarget(secretId: $secretId, targetId: $targetId) {
    ...SecretDetailFields
  }
}

mutation SecretExportCertificate($secretId: String!, $format: String!, $newPassphrase: String) {
  exportCertificate(secretId: $secretId, format: $format, newPassphrase: $newPassphrase) {
    fileBase64
    filename
    contentType
  }
}

mutation SecretReplaceCertificate(
  $secretId: String!
  $fileBase64: String!
  $passphrase: String
  $alias: String
) {
  replaceCertificate(
    secretId: $secretId
    fileBase64: $fileBase64
    passphrase: $passphrase
    alias: $alias
  ) {
    secret {
      ...SecretDetailFields
    }
    aliases
    meta {
      ...SecretCertMetaFields
    }
  }
}
