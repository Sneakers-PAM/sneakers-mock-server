name: Test
# Draft PRs are skipped; the run happens when the PR is marked ready.
on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    types: [opened, reopened, ready_for_review, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: 🧪 Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The committed client and SDL must match the committed schema copy.
      - name: Generated client is up to date
        run: |
          npm run schema:generate
          git diff --exit-code -- packages/gateway-client/src/generated

      - name: Check the image builds
        run: docker build -t sneakers-mock-server .
