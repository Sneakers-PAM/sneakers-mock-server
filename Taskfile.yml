version: "3"
# go-task is the standard runner for every project (regardless of ecosystem).
# It drives golic, the license-header tool. golic ships built-in license
# types, so only a .licignore is needed at the repo root.
vars:
  GOLIC_VERSION: v0.3.0
  TEMPLATE_LIC: "spdx-apache2"
  COMMON_LIC: "2026 The Sneakers-PAM Authors"
tasks:
  license:
    desc: Verify every source file carries the Apache-2.0 license header (CI; never writes).
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}" --dry -x
  license:fix:
    desc: Inject the Apache-2.0 header into any source file missing it.
    cmds:
      - go install github.com/Bugs5382/golic/cmd/golic@{{.GOLIC_VERSION}}
      - golic inject -t {{.TEMPLATE_LIC}} -c "{{.COMMON_LIC}}"
  start:
    desc: Run the mock gateway on 5171, with its controls at /_mock.
    env:
      LOG_LEVEL: trace
      LOG_FORMAT: console
    cmds:
      - npm start
  start:https:
    desc: The same, plus https on 5443 for the iOS simulator.
    env:
      LOG_LEVEL: trace
      LOG_FORMAT: console
    cmds:
      - npm run start:https
  test:
    desc: Run the tests.
    cmds:
      - npm test
  check:
    desc: Everything CI runs, locally.
    cmds:
      - npm run typecheck
      - npm run lint
      - npm run format:check
      - npm test
